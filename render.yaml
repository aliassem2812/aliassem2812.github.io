# Render blueprint: creates the AI chat server from the ai-server folder of this repository
services:
  - type: web
    name: ali-ai-chat
    runtime: node
    plan: free
    region: frankfurt
    rootDir: ai-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Private values: entered by hand in the Render dashboard, never stored in the repository
      - key: LLM_API_KEY
        sync: false
      - key: REFERENCE_NAME
        sync: false
      - key: REFERENCE_PHONE
        sync: false
      - key: REFERENCE_EMAIL
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://aliassem2812.github.io
